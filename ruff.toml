# Lint config for go-issue-agent.
# Run:  ruff check .
target-version = "py39"
line-length = 110
extend-exclude = ["workspace", "output", "indexes", ".venv"]

[lint]
# Pyflakes (F), syntax errors (E9), and bugbear (B) — the rules that catch real bugs
# and dead code. B905 (zip strict=) is excluded for Python 3.9 compatibility.
select = ["E9", "F", "B"]
ignore = ["B905"]
